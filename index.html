<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cidade Medieval</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="hud-phase" class="hud-box"></div>
    <div id="hud-clock" class="hud-box">TEMPO: 00:00</div>
    <div id="hud-resources" class="hud-box"></div>
    <div id="hud-readout" class="hud-box"></div>
  </div>

  <div id="build-ui">
    <div id="build-panel" hidden></div>
    <div id="build-status" hidden></div>
    <div id="build-bar">
      <button id="btn-build">Construir (B)</button>
      <button id="btn-demolish">Demolir (X)</button>
      <button id="btn-cancel">Cancelar (Esc)</button>
    </div>
  </div>

  <div id="notice" hidden></div>
  <div id="loading">Carregando mapa…</div>

  <!-- Ordem importa: não usamos módulos ES para o jogo abrir direto do index.html (file://) -->
  <script src="js/config.js"></script>
  <script src="js/time.js"></script>
  <script src="js/map.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/input.js"></script>
  <script src="js/interaction.js"></script>
  <script src="js/building/definitions.js"></script>
  <script src="js/building/manager.js"></script>
  <script src="js/building/validation.js"></script>
  <script src="js/building/views.js"></script>
  <script src="js/building/builder.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/buildmenu.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
